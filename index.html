<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14090f" media="(prefers-color-scheme: dark)" />
    <title>Beauty Store — Maquillaje y skincare coreano</title>
    <meta
      name="description"
      content="Maquillaje y skincare coreano de importación directa. Productos originales, asesoría personalizada y envío a todo el país."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Beauty Store — Maquillaje y skincare coreano" />
    <meta
      property="og:description"
      content="Productos coreanos originales, rutina en 5 pasos y asesoría personalizada. Envío a todo el país."
    />
    <meta property="og:locale" content="es_AR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello blanco.
      try {
        var stored = localStorage.getItem('beauty-store:theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
